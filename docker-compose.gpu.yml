# Optional override that gives the Ollama container the host's NVIDIA GPU.
# Needs the NVIDIA Container Toolkit on the host. Use:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
