# Render Blueprint for the OPT-IN hosted demo (T-016, REQ-015). Synthetic data only.
# Nothing deploys until the human creates the Blueprint in the Render dashboard.
# Guide: docs/deploy/render.md
services:
  - type: web
    name: openmedcheck-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # check current plans and prices in the Render dashboard
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: OPENMEDCHECK_ALLOW_NONLOCAL
        value: "1"
      - key: OPENMEDCHECK_HOST
        value: 0.0.0.0
      # The public host name Render assigns, e.g. openmedcheck-demo.onrender.com
      # (or your custom domain). Set it in the dashboard after the first deploy.
      - key: OPENMEDCHECK_PUBLIC_HOSTS
        sync: false
      # HTTPS URL of the Caddy proxy in front of Ollama (docs/deploy/digitalocean-gemma.md).
      - key: OPENMEDCHECK_OLLAMA_URL
        sync: false
      # Bearer token the proxy requires. Secret: paste it in the dashboard, never commit it.
      - key: OPENMEDCHECK_OLLAMA_API_KEY
        sync: false
